<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 185" width="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 14px; }
      .title-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .label-text { fill: #6e7681; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }

      /* Matrix Legend Palette */
      .c-off { fill: #161b22; rx: 2px; }
      .c-dim { fill: #0e4429; rx: 2px; }
      .c-med { fill: #006d32; rx: 2px; }
      .c-high { fill: #2ea043; rx: 2px; }
      .c-bright { fill: #39d353; rx: 2px; }

      /* Solid Structural Backbone (100% Bright, Never Dims) */
      .t-solid { fill: #39d353; rx: 2px; opacity: 1; }

      /* Controlled High-Legibility Glow (Stays >75% Brightness) */
      @keyframes softGlowA {
        0%, 100% { fill: #39d353; opacity: 1; }
        50% { fill: #2ea043; opacity: 0.8; }
      }
      @keyframes softGlowB {
        0%, 100% { fill: #2ea043; opacity: 0.75; }
        50% { fill: #39d353; opacity: 1; }
      }
      @keyframes ambientFlicker {
        0%, 100% { fill: #0e4429; opacity: 0.3; }
        50% { fill: #006d32; opacity: 0.75; }
      }

      .g1 { fill: #39d353; rx: 2px; animation: softGlowA 2.5s infinite ease-in-out; }
      .g2 { fill: #39d353; rx: 2px; animation: softGlowB 3.2s infinite ease-in-out 0.6s; }
      .n-amb { fill: #0e4429; rx: 2px; animation: ambientFlicker 3.8s infinite ease-in-out 0.4s; }
    </style>

    <!-- Matrix Background Grid Pattern -->
    <pattern id="matrix-grid" width="12.5" height="12.5" patternUnits="userSpaceOnUse">
      <rect width="9.5" height="9.5" rx="2" fill="#161b22" />
    </pattern>
  </defs>

